[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/taichi-ishitani/veryl-tbf"
# Not publishable yet: depends on unreleased Veryl (veryl-lang/veryl#3701).
publish = false

[workspace.dependencies]
veryl-tbf-runtime = { path = "crates/veryl-tbf-runtime" }
# Method reference arguments are not released yet (veryl-lang/veryl#3701).
veryl-component = { git = "https://github.com/taichi-ishitani/veryl", branch = "feat/component-method-ref-args" }
