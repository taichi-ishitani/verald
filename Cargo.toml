[workspace]
members = [
    "crates/verald",
    "crates/assertion",
    "crates/assertion/macros",
    "crates/host",
    "crates/macros/codegen",
    "crates/random",
    "crates/random/macros",
    "crates/tb/core",
    "crates/tb/runtime",
    "crates/tb/macros",
    "crates/tb/dpi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/taichi-ishitani/verald"
# Not publishable yet: depends on unreleased Veryl (veryl-lang/veryl#3701).
publish = false

[workspace.dependencies]
verald-assertion = { path = "crates/assertion" }
verald-assertion-macros = { path = "crates/assertion/macros" }
verald-host = { path = "crates/host" }
verald-macros-codegen = { path = "crates/macros/codegen" }
verald-random = { path = "crates/random" }
verald-random-macros = { path = "crates/random/macros" }
verald-tb-core = { path = "crates/tb/core" }
verald-tb-macros = { path = "crates/tb/macros" }
verald-tb-runtime = { path = "crates/tb/runtime" }
# Unreleased Veryl: master with veryl-lang/veryl#3772 (types generated
# from `#[export(rust)]`, the SDK's signals), its branch until merged; the
# `veryl +local` build is of the same commit.
veryl-component = { git = "https://github.com/taichi-ishitani/veryl", branch = "feat/export-rust" }
