[package]
name = "verald-macros-codegen"
description = "Code generation for Verald's signal structs (#[modport]), shared by its macro crates."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
