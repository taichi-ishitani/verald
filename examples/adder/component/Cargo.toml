[package]
name = "adder_tb"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
verald-tb-runtime = { path = "../../../crates/tb/runtime" }
# The component derives refer to `::veryl_component`; the same revision as
# the runtime's.
veryl-component = { git = "https://github.com/veryl-lang/veryl", branch = "master" }
# The DPI host, for a build that runs on a SystemVerilog simulator.
verald-tb-dpi = { path = "../../../crates/tb/dpi", optional = true }

[features]
# Builds for a SystemVerilog simulator (see `verilator/`) instead of Veryl's.
dpi = ["dep:verald-tb-dpi"]

# Standalone package.
[workspace]
